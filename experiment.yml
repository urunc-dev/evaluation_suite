
runtimes:
  - name: runc
    handler: io.containerd.runc.v2

  - name: kata
    handler: io.containerd.kata.v2

  - name: runsc
    handler: io.containerd.runsc.v1

  - name: urunc
    handler: io.containerd.urunc.v2


experiments:

  http-readiness:
    repetitions: 10
    workloads:
      default:
        image: docker.io/library/nginx:latest
        ports:
          containerPort: 80
          hostPort: 8082
      other:
      - image: harbor.nbfc.io/nubificus/urunc/nginx-qemu-unikraft-initrd:latest
        runtime: urunc
        ports:
          containerPort: 80
          hostPort: 8081

  lifecycle:
    workloads:
      default:
        image: docker.io/library/nginx:alpine

      other:
      - image: docker.io/jimjuniorb/minimalc:0.1
        runtime: urunc

  storage:
    workloads:
      default:
        image: docker.io/xridge/fio:latest
        snapshotter: overlayfs
      other:

      - image: docker.io/jimjuniorb/fio-urunc:0.8
        runtime: urunc
        snapshotter: devmapper

      - image: docker.io/jimjuniorb/fio-urunc:0.8
        runtime: urunc
        snapshotter: overlayfs


  network:
    workloads:
      default:
        image: networkstatic/iperf3:latest
      other:
      - image: docker.io/jimjuniorb/iperf3-urunc:0.3
        runtime: urunc

  cpu:
    workloads:
      default:
        image: jimjuniorb/stress-ng-benchmark:0.1
        cpu: 1
        cpuMethod: matrixprod
        timeout: 30s
        metricsBrief: true
      other:
      - image: jimjuniorb/stress-ng-urunc:0.7
        cpu: 1
        cpuMethod: matrixprod
        timeout: 30s
        metricsBrief: true
        runtime: urunc

  memory:
    repetitions: 10
    workloads:
      default:
        image: docker.io/library/nginx:alpine
      other:
      - image: harbor.nbfc.io/nubificus/urunc/nginx-qemu-unikraft-initrd:latest
        runtime: urunc
